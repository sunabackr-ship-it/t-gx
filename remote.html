<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E4A22">
<title>T!GX リモート卓</title>
<style>
:root{--bg:#F2EEDF;--card:#fff;--ink:#26331C;--sub:#6B7A5C;--line:#DDD8C4;
 --g:#6E9B3E;--gd:#2E4A22;--warn:#C8621F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:-apple-system,"Hiragino Sans",sans-serif;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer}
header{background:#fff;border-bottom:1px solid var(--line);padding:9px 12px;
 display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:14px;margin:0}
.mini{font-size:11px;color:var(--sub)}
.hide{display:none!important}
/* ---- キャラ選択（PC） ---- */
#pickWrap{max-width:720px;margin:0 auto;padding:18px 14px}
#pickWrap h2{font-size:15px;margin:0 0 4px}
#pickWrap .note{font-size:12px;color:var(--sub);margin:0 0 14px;line-height:1.7}
#pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.pk{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;
 text-align:center;position:relative}
.pk img{width:74px;height:74px;border-radius:50%;border:3px solid var(--line)}
.pk .nm{font-size:14px;font-weight:800;margin-top:6px}
.pk .fd{font-size:11px;color:var(--sub);margin-top:2px}
.pk .tk{position:absolute;top:8px;right:8px;font-size:10px;font-weight:800;
 background:#EDEAD9;color:var(--sub);border-radius:99px;padding:2px 8px}
.pk[data-taken="1"]{opacity:.55}
/* ---- QRパネル（PC） ---- */
#qrPane{background:#fff;border:1px solid var(--line);border-radius:12px;
 padding:14px;max-width:430px;margin:14px auto;text-align:center}
#qrPane .who{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:8px}
#qrPane .who img{width:44px;height:44px;border-radius:50%;border:3px solid}
#qrPane .who b{font-size:15px}
#qrPane svg{width:190px;height:190px}
#qrPane .url{font-size:10px;color:var(--sub);word-break:break-all;margin-top:6px}
#qrPane .note{font-size:12px;color:var(--sub);line-height:1.7;margin-top:8px}
#qrPane button{margin-top:10px;font-size:12px;font-weight:700;padding:8px 14px;
 border-radius:9px;border:1px solid var(--line);background:#F3F1E6;color:var(--gd)}
/* ---- PC 2画面 ---- */
#pcWrap{display:flex;flex-direction:column;padding:10px;height:calc(100vh - 54px);min-height:0}
#pcTabs{display:flex;gap:6px;margin-bottom:8px;flex:0 0 auto}
#pcTabs button{font-size:13px;font-weight:800;padding:9px 18px;border-radius:10px;
 border:1px solid var(--line);background:#F3F1E6;color:var(--gd)}
#pcTabs button.on{background:var(--gd);border-color:var(--gd);color:#fff}
#pcTabs .bdg{font-weight:700;font-size:11px;opacity:.85;margin-left:5px}
.pane{background:#fff;border:1px solid var(--line);border-radius:11px;display:flex;
 flex-direction:column;min-width:0;min-height:0}
.pane>h2{font-size:12px;color:var(--sub);margin:0;padding:9px 12px;
 border-bottom:1px solid var(--line);font-weight:700;
 display:flex;justify-content:space-between;align-items:center;gap:8px}
.pane>h2 button{font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:8px;
 border:1px solid var(--gd);background:var(--gd);color:#fff}
.pane>h2 button.alt{background:#fff;color:var(--warn);border-color:#E2C8BE}
#paneL,#paneR{flex:1 1 auto;min-height:0}
#boardBox{flex:1 1 auto;position:relative;overflow:auto;padding:8px;cursor:zoom-in}
#boardBox .pcp{cursor:grab}
#boardIn{position:relative;width:100%;transform-origin:0 0}
#boardIn img{width:100%;height:auto;display:block;border-radius:7px;
 user-select:none;pointer-events:none;-webkit-user-drag:none}
.pcp{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;
 border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.4);cursor:grab;touch-action:none;
 background-size:cover;background-position:center}
.pcp i{position:absolute;left:50%;transform:translateX(-50%);bottom:-13px;white-space:nowrap;
 font-size:9px;font-weight:800;color:#fff;border-radius:99px;padding:1px 6px;font-style:normal}
#tableBox{flex:1 1 auto;position:relative;overflow:auto;padding:10px;
 background-image:radial-gradient(#EFEDE0 1px,transparent 1px);background-size:18px 18px}
#tbl{position:relative;min-height:100%}
.lane{position:absolute;left:0;right:0;border-radius:9px}
.lane .lh{position:absolute;left:8px;top:5px;font-size:10.5px;font-weight:800}
.lane.low{background:#F2F8EC}  .lane.low  .lh{color:#4B7A2E}
.lane.mid{background:#FCF4E2}  .lane.mid  .lh{color:#A2761B}
.lane.high{background:#FBECE7} .lane.high .lh{color:#A8442A}
.cd{position:absolute;width:150px;min-height:120px;background:#fff;border:1px solid var(--line);
 border-radius:9px;padding:7px 8px;box-shadow:0 2px 6px rgba(0,0,0,.13);
 cursor:grab;touch-action:none;user-select:none}
.cd .own{font-size:9.5px;font-weight:800;color:#fff;border-radius:99px;padding:1px 6px;display:inline-block}
.cd .dbig{position:absolute;right:7px;top:7px;width:30px;height:30px;border-radius:8px;color:#fff;
 display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900}
.d低{background:#5E8F35} .d中{background:#C08A17} .d高{background:#A8442A}
.cd .t{font-size:12px;font-weight:700;line-height:1.3;margin:4px 36px 5px 0;
 display:flex;align-items:flex-start;gap:7px}
.ic{flex:0 0 auto;width:22px;height:22px;border-radius:5px;background:var(--ic,#6B7A5C);
 -webkit-mask:var(--m) center/80% no-repeat;mask:var(--m) center/80% no-repeat}
@supports not ((-webkit-mask-image:url(a)) or (mask-image:url(a))){ .ic{display:none} }

.cd .cost{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--sub);
 margin-bottom:5px;white-space:nowrap}
.cd .cost b{font-size:12px;color:var(--ink);margin-right:2px}
.dot{width:8px;height:8px;border-radius:50%;background:#C9A227;display:inline-block}
.dot.off{background:#E7E3D2}
.cd .cond2{display:flex;gap:4px;background:#FBF0D6;border:1px solid #E8CE8E;border-radius:6px;
 padding:3px 5px;margin-bottom:4px;font-size:9.5px;font-weight:800;color:#7A5A10;line-height:1.35}
.cd .fx{display:flex;flex-wrap:wrap;gap:3px}
.cd .fx span{font-size:9.5px;font-weight:800;border-radius:5px;padding:2px 5px;background:#EFEDE0;color:var(--sub)}
.cd .fx .red{background:#2E6C4A;color:#fff}
.cd .fx .mt{background:#E6F0D9;color:#3E6B22}
.cd .fx .bd{background:#F7E4D2;color:#A45E28}
.cd.focus{outline:3px solid #E8B21E;outline-offset:2px}
.cd.pick{outline:3px solid var(--g);outline-offset:2px}
.bywho{position:absolute;transform:translate(-50%,-100%);top:-4px;left:50%;white-space:nowrap;
 font-size:10px;font-weight:800;color:#fff;background:#E8B21E;border-radius:99px;padding:1px 7px}
.empty{font-size:12px;color:var(--sub);padding:14px}
#loupe{position:fixed;z-index:7;width:270px;height:270px;border-radius:50%;overflow:hidden;
 border:4px solid #fff;box-shadow:0 6px 24px rgba(0,0,0,.35);pointer-events:none;display:none}
#loupeIn{position:absolute;left:0;top:0;transform-origin:0 0}
#loupeIn img{display:block}
#loupeIn svg{position:absolute;inset:0}
#tip{position:fixed;z-index:8;max-width:300px;background:#26331C;color:#F3F1E6;border-radius:9px;
 padding:9px 11px;font-size:12px;line-height:1.65;box-shadow:0 6px 20px rgba(0,0,0,.3);
 pointer-events:none;opacity:0;transition:opacity .12s;display:none}
#tip.on{opacity:1}
#tip .th{font-weight:800;font-size:12.5px;margin-bottom:4px;color:#fff}
#tip .tm{font-size:10.5px;color:#B9C4A8;margin-bottom:6px}
#tip .tc{background:#4A3C10;color:#FBE7A8;border-radius:7px;padding:5px 7px;margin:0 0 6px;
 font-size:11px;font-weight:700}
#tip ul{margin:6px 0 0;padding-left:16px;font-size:11.5px;line-height:1.6}
/* ---- スマホ ---- */
#phWrap{max-width:560px;margin:0 auto;padding:0 0 90px}
#phHead{background:#fff;border-bottom:1px solid var(--line);padding:10px 12px;
 display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
#phHead img{width:44px;height:44px;border-radius:50%;border:3px solid}
#phHead .nm{font-size:15px;font-weight:800}
#phHead .sub{font-size:11px;color:var(--sub)}
#phBar{background:#fff;border-bottom:1px solid var(--line);padding:8px 12px;font-size:12px;color:var(--sub)}
#phBar b{color:var(--ink)}
#phList{padding:10px 12px}
.mcd{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:9px}
.mcd.out{border-color:var(--g);box-shadow:0 0 0 2px rgba(110,155,62,.25)}
.mcd .t{font-size:15px;font-weight:800;line-height:1.35;display:flex;align-items:center;gap:9px}
.mcd .t .ic{width:30px;height:30px;border-radius:7px}
.dbig2{flex:0 0 auto;width:56px;height:56px;border-radius:13px;color:#fff;
 display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.dbig2 b{font-size:27px;font-weight:900}
.dbig2 i{font-size:9px;font-style:normal;font-weight:700;opacity:.9;margin-top:3px}
.mcd .cost{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--sub);
 margin:7px 0 8px;white-space:nowrap}
.mcd .cost b{font-size:14px;color:var(--ink);margin-right:3px}
.mcd .cost .dot{width:9px;height:9px}
.mcd .cond2{display:flex;gap:7px;align-items:flex-start;background:#FBF0D6;border:1px solid #E8CE8E;
 border-radius:8px;padding:7px 9px;margin:0 0 9px;font-size:12px;font-weight:700;color:#7A5A10;line-height:1.5}
.mcd .cond2 em{font-style:normal;font-weight:800;color:#5C4409}
.mcd .fx{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.mcd .fx span{font-size:11px;font-weight:800;border-radius:6px;padding:3px 7px;background:#EFEDE0;color:var(--sub)}
.mcd .fx .red{background:#2E6C4A;color:#fff}
.mcd .fx .mt{background:#E6F0D9;color:#3E6B22}
.mcd .fx .bd{background:#F7E4D2;color:#A45E28}
.mcd .desc{font-size:12.5px;line-height:1.65;color:#3A4632;margin-bottom:10px}
.mcd .act{width:100%;font-size:13px;font-weight:800;padding:11px;border-radius:9px;
 border:1px solid var(--gd);background:var(--gd);color:#fff}
.mcd .act.g{background:#fff;color:var(--warn);border-color:#E2C8BE}
.mcd .act[disabled]{opacity:.4}
#phFoot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
 padding:9px 12px;font-size:12px;color:var(--sub)}
/* ---- 接続バッジ ---- */

};

async function connect(){
  if(MODE==="none") return;
  try{
    const {initializeApp}=await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js");
    const {getDatabase,ref,onValue,update}=await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js");
    const db=getDatabase(initializeApp(FIREBASE));
    const base=`workshops/${W}/teams/${T}/remote`;
    FBup = o=>{ try{
      const flat={}; Object.keys(o).forEach(k=>flat[`${base}/${k}`]=o[k]);
      update(ref(db), flat);
    }catch(e){ console.warn("sync:", e&&e.message); } };
    let first=true;
    onValue(ref(db,base), s=>{ $("#net").textContent="同期中"; $("#net").classList.add("on");
      window.__remote(s.val());
      if(first){ first=false;
        if(MODE==="phone"){ const o={}; MYCHS.forEach(k=>o[`hello/${k}`]=String(Date.now())); FBup(o); } }
    });
  }catch(e){
    $("#net").textContent="オフライン（この端末だけ）"; console.warn("firebase:", e&&e.message);
    render();
  }
}

function drawPick(){
  $("#pick").innerHTML=CH.map(c=>{
    const mineSel=MYS.includes(c.k);
    const tk=R.taken[c.k]==="1" && !mineSel;
    return `<button class="pk" data-k="${c.k}" data-taken="${tk?1:0}"
      style="${mineSel?'border-color:var(--gd);box-shadow:0 0 0 2px rgba(110,155,62,.3)':''}">
      ${tk?'<span class="tk">選ばれています</span>':(mineSel?'<span class="tk" style="background:var(--gd);color:#fff">あなた</span>':"")}
      <img src="${FACES[c.k]}" style="border-color:${FCO[c.k]}">
      <div class="nm">${c.n}</div>
      <div class="fd">読み込み係：${FNM[c.k]}　${(BY[c.k]||[]).length}枚</div></button>`;}).join("")
    +`<div style="grid-column:1/-1;text-align:center;margin-top:6px">
      <button id="pickGo" class="pk" style="padding:12px 22px;font-weight:800;font-size:14px;
        ${MYS.length?'background:var(--gd);color:#fff;border-color:var(--gd)':''}"
        ${MYS.length?"":"disabled"}>この組み合わせでQRを出す（${MYS.length}人ぶん）</button>
      <div class="fd" style="margin-top:6px">人数が少ない卓では、1人で2キャラ以上を受け持てます。</div></div>`;
  $("#pick").querySelectorAll(".pk[data-k]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k, i=MYS.indexOf(k);
    if(i>=0){ MYS.splice(i,1); R.taken[k]=""; put({[`taken/${k}`]:""}); }
    else{
      if(R.taken[k]==="1" && !confirm(`${CH.find(c=>c.k===k).n} はもう選ばれています。かわりに使いますか？`)) return;
      MYS.push(k); R.taken[k]="1"; put({[`taken/${k}`]:"1"});
    }
    drawPick();
  });
  const go=$("#pickGo");
  if(go) go.onclick=()=>{ drawQR(); render();
    $("#qrPane").scrollIntoView({behavior:"smooth",block:"center"}); };
}
function phoneURL(ks){
  const u=new URL(location.origin+location.pathname);   /* 余計なパラメータは持ち込まない */
  u.searchParams.set("w",W); u.searchParams.set("t",T); u.searchParams.set("char",ks.join(","));
  return u.toString();
}
function drawQR(){
  if(!MYS.length) return;
  const url=phoneURL(MYS);
  const qr=qrcode(0,"M"); qr.addData(url); qr.make();
  const names=MYS.map(k=>CH.find(c=>c.k===k).n).join("・");
  $("#qrPane").classList.remove("hide");
  $("#qrPane").innerHTML=`
    <div class="who">${MYS.map(k=>`<img src="${FACES[k]}" style="border-color:${FCO[k]}">`).join("")}<b>${names}</b></div>
    ${qr.createSvgTag({cellSize:4,margin:2,scalable:true})}
    <div class="url">${url}</div>
    <div class="note">このQRを<b>自分のスマホ</b>のカメラで読むと、${names}の手札がスマホに開きます。</div>
    <button id="qrGo">読み取れた（盤へすすむ）</button>`;
  $("#qrGo").onclick=()=>{ $("#pickWrap").classList.add("hide"); $("#pcWrap").classList.remove("hide"); render(); };
}

    const w2=o.w*PW+48, x=o.x*PW-24, y=o.y*PH-8, hh=58;
    h.push(`<rect data-lb="${o.label}" x="${x}" y="${y}" width="${w2}" height="${hh}" rx="12" fill="${o.bg}"/>`);
    h.push(`<text x="${x+w2/2}" y="${y+hh/2+13}" text-anchor="middle" fill="#fff"
      font-family="Hiragino Sans,sans-serif" font-weight="800" font-size="36">${esc(o.label)}</text>`);
  });
  svg.innerHTML=h.join("");
  /* マスのラベルにマウスを乗せると説明が出る */
  if(canHover) svg.querySelectorAll("[data-lb]").forEach(el=>{
    el.style.pointerEvents="auto";
    el.addEventListener("mouseenter",e=>{
      const lb=el.dataset.lb, star=el.dataset.st==="1";
      $("#tip").innerHTML=`<div class="th">${lb}${star?"　★スタート":""}</div>
        <div>${CELLDESC[lb]||""}</div>${star?`<div style="margin-top:5px;color:#B9C4A8">ここから始まるキャラの持ち場です</div>`:""}`;
      const t=$("#tip"); t.style.display="block";
      let x=e.clientX+16,y=e.clientY+16;
      const r=t.getBoundingClientRect();
      if(x+r.width>innerWidth-8)x=e.clientX-r.width-16;
      if(y+r.height>innerHeight-8)y=e.clientY-r.height-16;
      t.style.left=x+"px";t.style.top=y+"px";t.classList.add("on");});
    el.addEventListener("mouseleave",()=>tipHide());
  });
  loupeInit();
}
/* ===== 円形ルーペ：盤を「押さえている間だけ」その部分が2.2倍 =====
   虫眼鏡をかざすのと同じ動き。離すと消える。駒の上から押したときは駒の操作を優先 */
const LZ=2.2;
function loupeInit(){
  if(!canHover) return;
  const box=$("#boardBox"), lp=$("#loupe"), lin=$("#loupeIn");
  if(!box||box._loupe) return; box._loupe=1;
  lin.innerHTML=$("#boardIn").querySelector("img").outerHTML+$("#blab").outerHTML;
  const img=lin.querySelector("img"), svg2=lin.querySelector("svg");
  let hold=false;
  const show=e=>{
    const r=$("#boardIn").getBoundingClientRect();
    if(r.width<50){ lp.style.display="none"; return; }   /* レイアウト前は出さない */
    const fx=(e.clientX-r.left)/r.width, fy=(e.clientY-r.top)/r.height;
    if(fx<0||fx>1||fy<0||fy>1){ lp.style.display="none"; return; }
    const W2=r.width*LZ, H2=r.height*LZ;
    img.style.width=W2+"px"; svg2.style.width=W2+"px"; svg2.style.height=H2+"px";
    lin.style.transform=`translate(${135-fx*W2}px, ${135-fy*H2}px)`;
    lp.style.left=(e.clientX-135)+"px"; lp.style.top=(e.clientY-135)+"px";
    lp.style.display="block";
  };
  box.addEventListener("pointerdown",e=>{
    if(e.target.closest(".pcp")) return;          /* 駒は駒の操作 */
    hold=true; show(e); e.preventDefault();
  });
  box.addEventListener("pointermove",e=>{ if(hold) show(e); });
  const off=()=>{ hold=false; lp.style.display="none"; };
  box.addEventListener("pointerup",off);
  box.addEventListener("pointercancel",off);
  box.addEventListener("mouseleave",off);
}
/* ===== PC：盤 ===== */
function drawBoard(){
  const box=$("#boardIn"); if(!box) return;
  drawBlab();
  CH.forEach(c=>{
    let el=document.getElementById("bp_"+c.k);
    if(!el){ el=document.createElement("div"); el.className="pcp"; el.id="bp_"+c.k;
      el.style.backgroundImage=`url(${FACES[c.k]})`; el.style.borderColor=FCO[c.k];
      el.innerHTML=`<i style="background:${FCO[c.k]}">${c.n}</i>`;
      el.dataset.k=c.k; box.appendChild(el); bindPiece(el); }
    const q=R.bpos[c.k]||{x:STARTS[c.k][0],y:STARTS[c.k][1]};
    el.style.left=(q.x*100)+"%"; el.style.top=(q.y*100)+"%";
  });
}
function bindPiece(el){
  let drag=false;
  el.addEventListener("pointerdown",e=>{drag=true;dragging={kind:"piece",id:el.dataset.k};
    el.setPointerCapture(e.pointerId);e.preventDefault();});
  el.addEventListener("pointermove",e=>{if(!drag)return;
    const r=$("#boardIn").getBoundingClientRect();
    const x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
    const y=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
    R.bpos[el.dataset.k]={x:+x.toFixed(4),y:+y.toFixed(4)};
    el.style.left=(x*100)+"%"; el.style.top=(y*100)+"%";});
  el.addEventListener("pointerup",()=>{if(!drag)return;drag=false;dragging=null;
    put({[`bpos/${el.dataset.k}`]:R.bpos[el.dataset.k]});});
}

/* ===== PC：みんなの場（難易度レーン・決定的レイアウト） ===== */
const CW=150, CHH=132, GAP=12, LH=22;
const LANES=[["低","low"],["中","mid"],["高","high"]];
function cols(){ const w=($("#tableBox")||{}).clientWidth||360;
  return Math.max(1, Math.floor((w-GAP)/(CW+GAP))); }
function laneCards(d){ return allOffered().filter(o=>CBY[o.id]&&CBY[o.id].d===d)
  .sort((a,b)=>a.id-b.id); }
function layout(){
  /* posが書かれていないカードは、ID順のグリッドに全端末が同じ位置で描く */
  const c=cols(); let y=0; const out={}, laneMeta=[];
  LANES.forEach(([d,cls])=>{
    const list=laneCards(d);
    const rows=Math.max(1,Math.ceil(list.length/c));
    laneMeta.push({d,cls,top:y,h:LH+rows*(CHH+GAP)});
    list.forEach((o,i)=>{
      const auto={x:GAP+(i%c)*(CW+GAP), y:y+LH+Math.floor(i/c)*(CHH+GAP)};
      const q=R.pos[o.id];
      out[o.id]= q ? {x:q.x, y:y+LH+q.y} : auto;   /* posは「レーン内相対」で保存 */
      out[o.id].lane={top:y+LH, h:rows*(CHH+GAP)};
      out[o.id].ck=o.ck;
    });
    y+=LH+rows*(CHH+GAP)+GAP;
  });
  return {cards:out, lanes:laneMeta, height:y};
}
function drawTable(){
  const tb=$("#tbl"); if(!tb) return;
  const off=allOffered();
  if(!off.length){ tb.innerHTML=`<p class="empty">まだ誰も出していません。各自スマホでカードを出すと、ここに並びます。</p>`;
    tb.style.height="auto"; $("#cnt").textContent=""; drawActs(); return; }
  const L=layout();
  let h=L.lanes.map(l=>`<div class="lane ${l.cls}" style="top:${l.top}px;height:${l.h}px">
     <span class="lh">難易度 ${l.d}</span></div>`).join("");
  Object.keys(L.cards).forEach(id=>{
    const p=CBY[id], q=L.cards[id], ck=q.ck;
    const cls=(R.chosen==id?"pick ":"")+(R.focus==id?"focus":"");
    h+=`<div class="cd ${cls}" data-p="${id}" style="left:${q.x}px;top:${q.y}px">
      ${R.focus==id&&R.focusBy?`<span class="bywho">${R.focusBy} が見ています</span>`:""}
      <span class="dbig d${p.d}">${p.d}</span>
      <span class="own" style="background:${FCO[ck]}">${CH.find(c=>c.k===ck).n}</span>
      <div class="t"><span class="ic" data-i="${p.id}" style="--ic:${FCO[ck]}"></span>${p.n}</div>
      <div class="cost"><b>${p.cost}</b>${dots(p.cost)}<span style="margin-left:3px">コスト</span></div>
      ${p.cond.length?`<div class="cond2">🔒 ${p.cond.map(c=>c.t).join(" ／ ")}</div>`:""}
      <div class="fx">${fxChips(p)}</div></div>`;});
  tb.innerHTML=h; tb.style.height=L.height+"px";
  tb.querySelectorAll(".cd").forEach(el=>{ bindCard(el); tipBind(el,+el.dataset.p); });
  $("#cnt").textContent=off.length+"枚";
  drawActs();
}
function bindCard(el){
  let drag=false,moved=false,ox=0,oy=0;
  el.addEventListener("pointerdown",e=>{drag=true;moved=false;dragging={kind:"card",id:el.dataset.p};
    const r=el.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;
    el.setPointerCapture(e.pointerId);e.preventDefault();tipHide();});
  el.addEventListener("pointermove",e=>{if(!drag)return;moved=true;
    const L=layout(), q=L.cards[el.dataset.p]; if(!q)return;
    const t=$("#tbl").getBoundingClientRect();
    const x=Math.max(0,Math.min(t.width-CW, e.clientX-t.left-ox));
    const yAbs=Math.max(q.lane.top, Math.min(q.lane.top+q.lane.h-CHH, e.clientY-t.top-oy));
    R.pos[el.dataset.p]={x:Math.round(x), y:Math.round(yAbs-q.lane.top)};
    el.style.left=x+"px"; el.style.top=yAbs+"px";});
  el.addEventListener("pointerup",()=>{if(!drag)return;drag=false;dragging=null;
    if(!moved){
      const same=(R.focus==el.dataset.p);
      R.focus=same?"":el.dataset.p;
      R.focusBy=same?"":MYS.map(k=>(CH.find(c=>c.k===k)||{}).n).join("・")||"";
      put({focus:R.focus, focusBy:R.focusBy}); render();
    }else{
      put({[`pos/${el.dataset.p}`]:R.pos[el.dataset.p]});
    }});
}
const focusOnTable=()=> R.focus && allOffered().some(o=>String(o.id)===String(R.focus));
function drawActs(){
  const t=$("#btnTake"), u=$("#btnUndo"); if(!t) return;
  t.classList.toggle("hide", !(!R.chosen && focusOnTable()));
  u.classList.toggle("hide", !R.chosen);
  t.onclick=()=>{ if(!focusOnTable()) return;      /* 下げられた直後の空振り防止 */
    R.chosen=String(R.focus); R.focus=""; R.focusBy="";
    put({chosen:R.chosen, focus:"", focusBy:""}); render(); };
  u.onclick=()=>{ R.chosen=""; put({chosen:""}); render(); };
}

/* ===== 吹き出し（マウスのある端末だけ） ===== */
const canHover=matchMedia("(hover:hover) and (pointer:fine)").matches;
let tipT=null;
function tipShow(p,x,y){
  const el=$("#tip");
  el.innerHTML=`<div class="th">${p.n}</div>
    <div class="tm">No.${p.id}　コスト${p.cost}　むずかしさ ${p.d}　${FNM[p.f]}</div>
    ${p.cond.length?`<div class="tc">🔒 これを出すには　${p.cond.map(c=>c.t).join(" ／ ")}</div>`:""}
    <div>${p.desc}</div>${p.fx.length?`<ul>${p.fx.map(t=>`<li>${t}</li>`).join("")}</ul>`:""}`;
  el.style.display="block";
  const r=el.getBoundingClientRect();
  let L2=x+14,TP=y+16;
  if(L2+r.width>innerWidth-8)L2=Math.max(8,x-r.width-14);
  if(TP+r.height>innerHeight-8)TP=Math.max(8,y-r.height-16);
  el.style.left=L2+"px";el.style.top=TP+"px";el.classList.add("on");
}
function tipHide(){const el=$("#tip");el.classList.remove("on");el.style.display="none";clearTimeout(tipT);}
function tipBind(el,id){
  if(!canHover)return;
  const p=CBY[id]; if(!p)return;
  el.addEventListener("mouseenter",e=>{clearTimeout(tipT);const x=e.clientX,y=e.clientY;
    tipT=setTimeout(()=>tipShow(p,x,y),220);});
  el.addEventListener("mousemove",e=>{if($("#tip").classList.contains("on"))tipShow(p,e.clientX,e.clientY);});
  el.addEventListener("mouseleave",tipHide);
}
addEventListener("scroll",tipHide,true);

/* ===== スマホ ===== */
function drawPhone(){
  const ck=MYCHS[phCur]||MYCHS[0], c=CH.find(x=>x.k===ck);
  if(!c){ $("#phList").innerHTML=`<p class="empty">キャラクターの指定がまちがっています。</p>`; return; }
  const tabs = MYCHS.length>1
    ? `<div style="display:flex;gap:6px;margin-left:auto">${MYCHS.map((k,i)=>{
        const cc=CH.find(x=>x.k===k);
        return `<button data-pc="${i}" style="width:44px;height:44px;border-radius:50%;padding:0;
          border:3px solid ${i===phCur?FCO[k]:"var(--line)"};background:url(${FACES[k]}) center/cover;
          ${i===phCur?"":"opacity:.5"}" title="${cc.n}"></button>`;}).join("")}</div>`
    : "";
  $("#phHead").innerHTML=`<img src="${FACES[ck]}" style="border-color:${FCO[ck]}">
    <div><div class="nm">${c.n}</div>
    <div class="sub">読み込み係：${FNM[ck]}　${(BY[ck]||[]).length}枚</div></div>${tabs}`;
  $("#phHead").querySelectorAll("[data-pc]").forEach(b=>b.onclick=()=>{phCur=+b.dataset.pc;render();});
  const mine=offerIds(ck);
  $("#phBar").innerHTML = R.chosen
    ? `決まり：<b>${(CBY[R.chosen]||{}).n||""}</b>`
    : `${c.n}が出しているのは <b>${mine.length}／2枚</b>　みんなの場はPCの画面で`;
  $("#phList").innerHTML=(BY[ck]||[]).map(p=>{
    const out=mine.includes(p.id);
    return `<div class="mcd ${out?"out":""}">
      <div class="t"><span class="ic" data-i="${p.id}" style="--ic:${FCO[p.f]}"></span>
        <span style="flex:1">${p.n}</span>
        <span class="dbig2 d${p.d}"><b>${p.d}</b><i>むずかしさ</i></span></div>
      <div class="cost"><b>${p.cost}</b>${dots(p.cost)}<span style="margin-left:3px">コスト</span></div>
      ${p.cond.length?`<div class="cond2"><span>🔒</span><span><em>これを出すには</em>　${p.cond.map(c=>c.t).join(" ／ ")}</span></div>`:""}
      <div class="fx">${fxChips(p)}</div>
      <div class="desc">${p.desc}</div>
      <button class="act ${out?"g":""}" data-t="${p.id}" ${R.chosen?"disabled":""}>${out?"下げる":"場に出す"}</button>
      </div>`;}).join("");
  $("#phList").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
    if(R.chosen) return;
    const id=+b.dataset.t, cur=offerIds(ck), i=cur.indexOf(id);
    if(i>=0) cur.splice(i,1);
    else{ if(cur.length>=2){
        $("#phFoot").textContent="1キャラ2枚までです。どれかを下げてから出してください。";
        clearTimeout(window._nt); window._nt=setTimeout(()=>{
          $("#phFoot").textContent="見えるのは自分の担当カードだけ。場を見て決めるのはPCの画面です。";},2800);
        return; }
      cur.push(id); }
    R.offer[ck]=cur.join(",");
    put({[`offer/${ck}`]:R.offer[ck]});
    render();
  });
}
/* ===== 画面の出し分け ===== */
function render(){
  $("#hMeta").textContent = (MODE==="none")?"":`${W}／チーム${T}`;
  if(MODE==="none"){ $("#noParam").classList.remove("hide"); return; }
  if(MODE==="phone"){
    $("#phWrap").classList.remove("hide");
    $("#hState").textContent="";
    drawPhone(); return;
  }
  /* PC */
  $("#hState").textContent = R.chosen ? `決まり：${(CBY[R.chosen]||{}).n||""}` :
    (MYS.length?`あなた：${MYS.map(k=>(CH.find(c=>c.k===k)||{}).n).join("・")}`:"");
  if(!MYS.length){ $("#pickWrap").classList.remove("hide"); drawPick(); return; }
  drawPick();                                      /* taken の表示更新 */
  if(!$("#pickWrap").classList.contains("hide")) drawQR();
  const n=allOffered().length;
  $("#roomBdg").textContent = R.chosen ? "決まり" : (n?`${n}枚`:"");
  if(pcTab==="board") drawBoard(); else drawTable();
}
let pcTab="room";
function setTab(t){ pcTab=t;
  $("#paneL").classList.toggle("hide", t!=="board");
  $("#paneR").classList.toggle("hide", t!=="room");
  $("#tabBoard").classList.toggle("on", t==="board");
  $("#tabRoom").classList.toggle("on", t==="room");
  if(t==="room") drawTable(); else drawBoard();
}
$("#tabBoard").onclick=()=>setTab("board");
let bz=1;
function setBz(z, fx, fy){
  /* fx,fy＝盤の中の注視点（0〜1）。指定があればズーム後にその点を視界中央へ */
  const box=$("#boardBox");
  if(fx==null){ const r=$("#boardIn").getBoundingClientRect(), b=box.getBoundingClientRect();
    fx=((b.left+b.width/2)-r.left)/r.width; fy=((b.top+b.height/2)-r.top)/r.height;
    fx=Math.min(1,Math.max(0,fx)); fy=Math.min(1,Math.max(0,fy)); }
  bz=Math.min(3,Math.max(1,z));
  $("#boardIn").style.width=(bz*100)+"%";
  $("#bzLv").textContent=Math.round(bz*100)+"%";
  box.classList.toggle("zoomed", bz>1);
  const r2=$("#boardIn").getBoundingClientRect();
  box.scrollLeft = fx*r2.width  - box.clientWidth/2;
  box.scrollTop  = fy*r2.height - box.clientHeight/2;
}
$("#bzIn").onclick=()=>setBz(bz+0.25);
$("#bzOut").onclick=()=>setBz(bz-0.25);

$("#tabRoom").onclick=()=>setTab("room");
$("#btnQR") && ($("#btnQR").onclick=()=>{
  $("#pcWrap").classList.add("hide"); $("#pickWrap").classList.remove("hide"); drawQR(); });
addEventListener("resize",()=>{ if(MODE==="pc"&&me) drawTable(); });

render();
connect();
</script>
